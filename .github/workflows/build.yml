name: Maven Build and Release

on:
  push:
    branches: [main, 'feature/**', 'feat/**', 'fix/**', 'chore/**', '!chore/v*-SNAPSHOT']
  pull_request:
    branches: [main]

jobs:
  Snapshot:
    permissions:
      contents: read
    uses: avioconsulting/shared-workflows/.github/workflows/maven-snapshot-check.yml@main

  Build:
    needs: Snapshot
    if: needs.Snapshot.outputs.verified != 'true'
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: avioconsulting/shared-workflows/.github/workflows/maven-build.yml@main
    with:
      java-version: '17'

  Log4j-compatibility:
    needs: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # The shared build already tests the packaged JAR on 2.26.1.
        log4j: ['2.20.0', '2.25.5']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/download-artifact@v8
        with:
          name: build-artifacts
      - name: Test the shared build's JAR with Log4j ${{ matrix.log4j }}
        run: |
          # Give javac the packaged classes to compile only the test sources.
          mkdir -p target/classes
          (cd target/classes && jar xf ../log4j2-sqs-appender-*.jar)
          ./mvnw -B -ntp -Dlog4j.version=${{ matrix.log4j }} -DfailIfNoTests=true \
            resources:testResources compiler:testCompile docker:start@docker-start \
            failsafe:integration-test docker:stop@docker-stop failsafe:verify

  Release:
    needs: [Build, Log4j-compatibility]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: avioconsulting/shared-workflows/.github/workflows/maven-release.yml@main
    secrets:
      MAVEN_PUBLISH_USERNAME: ${{ secrets.MAVEN_PUBLISH_USERNAME }}
      MAVEN_PUBLISH_PASSWORD: ${{ secrets.MAVEN_PUBLISH_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
      JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
      JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
    with:
      app-version: ${{ needs.Build.outputs.app-version }}
      publish-maven-central: true
      java-distribution: temurin
      java-version: '17'

  PR-validation:
    needs: [Snapshot, Build, Log4j-compatibility]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require verified bump or full build and compatibility checks
        env:
          CLASSIFIED: ${{ needs.Snapshot.result }}
          VERIFIED: ${{ needs.Snapshot.outputs.verified }}
          BUILD: ${{ needs.Build.result }}
          COMPAT: ${{ needs.Log4j-compatibility.result }}
        run: |
          [[ "$CLASSIFIED" == success ]] || exit 1
          if [[ "$VERIFIED" == true ]]; then
            echo 'Next snapshot verified.'
          else
            [[ "$BUILD" == success && "$COMPAT" == success ]]
          fi

  Post-Release:
    needs: [Build, Release]
    permissions:
      contents: write
      pull-requests: write
    uses: avioconsulting/shared-workflows/.github/workflows/maven-post-release.yml@main
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      release-app-id: ${{ vars.RELEASE_APP_ID }}
      app-version: ${{ needs.Build.outputs.app-version }}
      java-distribution: temurin
      java-version: '17'
